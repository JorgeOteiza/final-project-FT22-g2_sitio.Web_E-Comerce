# This file was generated by Render's heroku-import Heroku CLI plugin
# https://www.npmjs.com/package/@renderinc/heroku-import
# Schema documented at https://render.com/docs/yaml-spec
services:
  - type: web
    name: el-rincon-del-vino
    runtime: python
    region: ohio
    plan: free
    buildCommand: bash ./render_build.sh
    startCommand: gunicorn wsgi:app --chdir ./src --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/productos
    envVars:
      - key: FLASK_APP
        value: src/app.py
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: NODE_VERSION
        value: 20.15.1
      - key: BASENAME
        value: /
      - key: BACKEND_URL
        value: /
      - key: FRONTEND_URL
        value: https://el-rincon-del-vino.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rincon-del-vino-db
          property: connectionString

databases:
  - name: rincon-del-vino-db
    region: ohio
    plan: free
    ipAllowList: []
